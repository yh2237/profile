<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0yh.dev | Font Test</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="img/favicon.png" type="image/png">
</head>

<body class="home font-loading">

    <header class="site-header">
        <div class="header-inner">
            <div class="header-brand">
                <a href="https://0yh.dev/" class="brand-mark">
                    <img src="img/banner.png" alt="0yh.dev" class="banner" height="40">
                </a>
            </div>
            <nav class="header-nav" role="navigation" aria-label="Header navigation">
                <a href="/">TOP</a>
                <a href="/status">Server Status</a>
                <a href="/contact">Contact</a>
                <a href="https://adachidb.net/" target="_blank">足立データベース</a>
                <a href="https://adachi.0yh.dev" target="_blank">足立レイ読み上げBot</a>
            </nav>
        </div>
    </header>

    <div class="page-wrapper">
        <div id="fontLoader" class="font-loader" role="status" aria-live="polite">
            <div class="font-loader-inner">
                <p class="font-loader-title">フォントを読み込み中</p>
                <div class="font-loader-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="fontProgress" class="font-loader-fill"></div>
                </div>
                <div class="font-loader-meta">
                    <span id="fontProgressText">0%</span>
                    <button type="button" id="liteModeButton" class="font-loader-button">軽量ページを読み込む</button>
                </div>
                <noscript>
                    <p class="noscript-msg">なんと、JavaScriptを有効にしないと動かない</p>
                </noscript>
            </div>
        </div>

        <main class="content">
            <section class="readme-section">
                <div class="readme-header">
                    <h2>Font test</h2>
                </div>
                <div class="profile-container">
                    <p>
                        末尾に <code>?delay=5000</code> を付けると最低待機時間を変更できます。
                    </p>
                </div>
            </section>

            <section class="grid">
                <article class="panel">
                    <h2>Sample Text</h2>
                    <p>今日は良い天気です。Hello, world. 1234567890</p>
                </article>
            </section>
        </main>
    </div>

<script src="js/font_loader_test.js"></script>

</body>

</html>
